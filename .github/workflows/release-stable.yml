name: Publish Node-Stable tagged release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate immutable version and source
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag"; exit 1; }
          test "$VERSION" = "$(cat VERSION)" || { echo "Tag disagrees with VERSION"; exit 1; }
          test "$(cat UPSTREAM_SOURCE_COMMIT)" = ce297cf53c05214bb2495e0b031d92b475229be3
          grep -Fq 'dockerps13/Node-Stable/releases' install.sh
          bash -n install.sh
          test -f third_party/sing-anytls/LICENSE
      - name: Verify source and installer
        run: |
          set -euo pipefail
          go test -tags "with_quic with_utls with_wireguard with_acme with_clash_api" ./...
          bash tests/installer-safety.sh
          bash tests/limits-acceptance.sh
      - name: Build verified Linux packages
        run: |
          set -euo pipefail
          make build-linux build-linux-arm64 VERSION="$GITHUB_REF_NAME"
          ./xboard-node-linux-amd64 -v | grep -F "$GITHUB_REF_NAME"
          ./xbctl-linux-amd64 --help
      - name: Package and verify
        run: |
          set -euo pipefail
          mkdir dist
          cp xboard-node-linux-amd64 xboard-node-linux-arm64 xbctl-linux-amd64 xbctl-linux-arm64 install.sh dist/
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT
          cp CHANGELOG.md dist/CHANGELOG
          (cd dist && sha256sum xboard-node-linux-amd64 xboard-node-linux-arm64 xbctl-linux-amd64 xbctl-linux-arm64 install.sh SOURCE_COMMIT CHANGELOG > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Publish new repository Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$GITHUB_REF_NAME"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing overwrite"
            exit 1
          fi
          gh release create "$VERSION" \
            dist/xboard-node-linux-amd64 dist/xboard-node-linux-arm64 \
            dist/xbctl-linux-amd64 dist/xbctl-linux-arm64 \
            dist/install.sh dist/SOURCE_COMMIT dist/CHANGELOG dist/SHA256SUMS \
            --verify-tag --title "Node-Stable $VERSION" --latest \
            --notes "Node-Stable $VERSION. See the packaged CHANGELOG and SOURCE_COMMIT for release changes and provenance. Review compatibility, security groups, backups, and rollback before deployment. Optional cross-machine accounting integrations are not automatically deployed."
