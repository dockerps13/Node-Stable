name: Multi-platform build validation
# Vendored AnyTLS dependency required and now tracked in repository
on:
  push:
    branches: [main, 'develop/**']
    paths:
      - 'VERSION'
      - 'tests/release-version-policy.sh'
      - 'cmd/**'
      - 'internal/**'
      - 'third_party/**'
      - 'go.mod'
      - 'go.sum'
      - 'install.sh'
      - '.github/workflows/multiplatform.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-amd64, goos: linux, goarch: amd64, experimental: false, ext: ""}
          - {name: linux-arm64, goos: linux, goarch: arm64, experimental: false, ext: ""}
          - {name: linux-386, goos: linux, goarch: "386", experimental: true, ext: ""}
          - {name: linux-armv7, goos: linux, goarch: arm, goarm: "7", experimental: true, ext: ""}
          - {name: macos-amd64, goos: darwin, goarch: amd64, experimental: true, ext: ""}
          - {name: macos-arm64, goos: darwin, goarch: arm64, experimental: true, ext: ""}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release-version policy
        run: bash tests/release-version-policy.sh
      - name: Compile for target platform
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="$(cat VERSION)"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Invalid VERSION: $VERSION"; exit 1; fi
          go build -tags "with_quic with_utls with_wireguard with_acme with_clash_api" -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA}" -o "dist/xboard-node-${{ matrix.name }}${{ matrix.ext }}" ./cmd/xboard-node
          go build -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA}" -o "dist/xbctl-${{ matrix.name }}${{ matrix.ext }}" ./cmd/xbctl
      - uses: actions/upload-artifact@v4
        with:
          name: Node-Stable-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
