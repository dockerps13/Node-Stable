name: v1.0.5 automatic isolated functional acceptance
on:
  push:
    branches: [feature/global-device-admission-v105]
    paths: ['.github/workflows/v105-automatic-acceptance.yml', 'internal/**', 'third_party/**', 'go.mod', 'go.sum']
  pull_request:
    paths: ['.github/workflows/v105-automatic-acceptance.yml', 'internal/**', 'third_party/**', 'go.mod', 'go.sum']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-protocols:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Xray MUX TCP and XUDP actual roundtrip
        run: |
          go test -v -race -count=2 -timeout=8m ./internal/kernel/xray -run '^TestRealXrayMuxTCPRevocation$'
          go test -v -race -count=2 -timeout=8m -tags xray_xudp_e2e ./internal/kernel/xray -run '^TestRealXrayXUDPRoundTripAndRevocation$'
      - name: Hysteria2 and TUIC UDP revocation under race detector
        run: go test -v -race -count=4 -timeout=12m -tags "with_quic with_utls with_wireguard with_clash_api" ./internal/kernel/singbox -run '^TestRealQUICUDPStrictGlobalAdmission$'
  redis-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit and panel lease client tests without Redis integration flag
        run: |
          go test -race -count=3 -timeout=5m ./internal/globaladmission
          go test -race -count=2 -timeout=90s ./internal/panel -run '^TestDeviceLease'
      - name: Two machine clients using test Redis
        env:
          GLOBAL_ADMISSION_REDIS_INTEGRATION: '1'
        run: go test -race -count=1 -timeout=120s ./internal/globaladmission -run '^TestTwoMachineClientsHTTPRedisAuthority$'
      - name: Two separate OS processes using test Redis
        env:
          GLOBAL_ADMISSION_REDIS_INTEGRATION: '1'
        run: go test -race -count=1 -timeout=120s ./internal/globaladmission -run '^TestTwoIndependentNodeProcesses$'
  laravel-two-node:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      LOG_CHANNEL: stderr
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_STORE: array
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ''
      REDIS_PREFIX: ''
      DB_CONNECTION: sqlite
      DB_DATABASE: ../v105-stage.sqlite
      GLOBAL_DEVICE_ADMISSION_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: dockerps13/Xboard
          ref: feature/global-device-admission-v105
          path: xboard
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: redis, pdo_sqlite, mbstring, xml, curl, zip, bcmath
          coverage: none
      - name: Prepare isolated Laravel
        run: |
          composer install --working-dir=xboard --no-interaction --prefer-dist --no-progress --no-scripts
          touch "$GITHUB_WORKSPACE/v105-stage.sqlite"
          php xboard/tests/global-device-stage-bootstrap.php
      - name: Start isolated Laravel API
        run: |
          php -S 127.0.0.1:8765 -t xboard/public xboard/public/index.php >/tmp/v105-panel.log 2>&1 &
          echo $! > /tmp/v105-panel.pid
          for i in $(seq 1 30); do
            status="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Accept: application/json' http://127.0.0.1:8765/api/v2/server/device-lease || true)"
            if [ "$status" != "000" ]; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify authenticated lease and two process integration
        env:
          GLOBAL_ADMISSION_REDIS_INTEGRATION: '1'
          GLOBAL_ADMISSION_REAL_PANEL_URL: http://127.0.0.1:8765
        run: |
          response="$(curl -sS -w '\nHTTP_CODE:%{http_code}' -X POST http://127.0.0.1:8765/api/v2/server/device-lease -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"machine_id":101,"node_id":11,"token":"secret-a","action":"acquire","user_id":7,"lease_id":"stage-auto-000001","ip":"192.0.2.100"}')"
          echo "$response" | grep -F '"allowed":true'
          go test -race -count=1 -timeout=120s ./internal/globaladmission -run '^TestTwoIndependentNodeProcesses$'
      - name: Stop test HTTP server
        if: always()
        run: |
          if [ -f /tmp/v105-panel.pid ]; then kill "$(cat /tmp/v105-panel.pid)" 2>/dev/null || true; fi
  summary:
    runs-on: ubuntu-latest
    needs: [real-protocols, redis-admission, laravel-two-node]
    if: always()
    steps:
      - name: Write results and keep live staging gates unverified
        env:
          PROTOCOL: ${{ needs.real-protocols.result }}
          REDIS: ${{ needs.redis-admission.result }}
          LARAVEL: ${{ needs.laravel-two-node.result }}
        run: |
          echo '## Automatic isolated acceptance' >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Protocol: $PROTOCOL; Redis: $REDIS; Laravel: $LARAVEL" >> "$GITHUB_STEP_SUMMARY"
          echo '24h real staging dual-node soak: NOT RUN' >> "$GITHUB_STEP_SUMMARY"
          echo 'Live staging systemd fault injection: NOT RUN' >> "$GITHUB_STEP_SUMMARY"
          test "$PROTOCOL" = success && test "$REDIS" = success && test "$LARAVEL" = success
