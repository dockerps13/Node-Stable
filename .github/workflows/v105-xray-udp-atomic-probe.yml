name: v1.0.5 integrated Xray UDP MUX race acceptance

on:
  pull_request:
    paths:
      - 'third_party/xray-core/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/v105-xray-udp-atomic-probe.yml'
  push:
    branches:
      - feature/global-device-admission-v105
    paths:
      - 'third_party/xray-core/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/v105-xray-udp-atomic-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xray-udp-integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify official Go builds resolve patched local Xray
        run: |
          grep -Fq 'replace github.com/xtls/xray-core => ./third_party/xray-core' go.mod
          grep -Fq 'closed atomic.Bool' third_party/xray-core/transport/internet/udp/dispatcher.go
          grep -Fq 'b.UDP = &destination' third_party/xray-core/common/mux/reader.go
          go list -m -json github.com/xtls/xray-core | grep -F 'third_party/xray-core'
          go mod verify
      - name: Verify real VLESS XUDP revocation under Go race detector
        run: go test -race -count=20 -timeout=12m -tags xray_xudp_e2e ./internal/kernel/xray -run '^TestRealXrayXUDPRoundTripAndRevocation$'
      - name: Verify real VLESS MUX TCP revocation
        run: go test -race -count=5 -timeout=8m ./internal/kernel/xray -run '^TestRealXrayMuxTCPRevocation$'
      - name: Compile candidate binary with integrated Xray dependency
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$RUNNER_TEMP/xboard-node-xray-integrated" ./cmd/xboard-node
          "$RUNNER_TEMP/xboard-node-xray-integrated" -v
          sha256sum "$RUNNER_TEMP/xboard-node-xray-integrated" > integrated-xray-binary.sha256
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v105-xray-integrated-${{ github.run_id }}-${{ github.run_attempt }}
          path: integrated-xray-binary.sha256
          if-no-files-found: warn
