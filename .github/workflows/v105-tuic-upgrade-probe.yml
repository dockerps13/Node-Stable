name: v1.0.5 TUIC upstream fix compatibility probe

on:
  pull_request:
    paths:
      - '.github/workflows/v105-tuic-upgrade-probe.yml'
  push:
    branches:
      - feature/global-device-admission-v105
    paths:
      - '.github/workflows/v105-tuic-upgrade-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sing-quic-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Trial upstream sing-quic v0.7.0 with full dependency resolution
        run: |
          go mod edit -require=github.com/sagernet/sing-quic@v0.7.0
          go mod tidy
          go list -m github.com/sagernet/sing-quic github.com/sagernet/sing github.com/sagernet/quic-go
      - name: Compile Xray and sing-box with production protocol tags
        run: go test -run '^$' -timeout=8m -tags "with_quic with_utls with_wireguard with_clash_api" ./internal/kernel/xray ./internal/kernel/singbox
      - name: Repeated real TUIC UDP lease revocation race test
        run: go test -race -count=12 -timeout=12m -tags "with_quic with_utls with_wireguard with_clash_api" ./internal/kernel/singbox -run '^TestRealQUICUDPStrictGlobalAdmission/tuic$'
      - name: Capture trial module graph
        if: always()
        run: |
          cp go.mod tuic-trial-go.mod
          cp go.sum tuic-trial-go.sum
      - name: Upload trial dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuic-upgrade-probe-modules
          path: |
            tuic-trial-go.mod
            tuic-trial-go.sum
          if-no-files-found: warn
